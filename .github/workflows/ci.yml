name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [passwordstream, passwordstream-backend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - if: matrix.project == 'passwordstream'
        run: npm run lint
      - if: matrix.project == 'passwordstream'
        run: npm run build
      - if: matrix.project == 'passwordstream-backend'
        run: node --check server.js
      - if: matrix.project == 'passwordstream-backend'
        run: node --check security.js
